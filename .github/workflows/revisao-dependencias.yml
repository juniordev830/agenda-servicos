name: Auditoria de dependências Maven

on:
  pull_request:
    paths:
      - pom.xml
      - '.github/workflows/revisao-dependencias.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inventariar dependências, inclusive de testes
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=true -DoutputFormat=json
      - name: Conferir os componentes com a base pública OSV
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --retry 2 'https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64' -o "$scanner"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $scanner" | sha256sum --check --strict
          chmod +x "$scanner"
          "$scanner" scan source --offline --download-offline-databases -L target/bom.json
